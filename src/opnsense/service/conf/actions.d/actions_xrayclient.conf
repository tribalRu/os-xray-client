[start]
command:/usr/local/etc/rc.d/os-xray-client start
parameters:
type:script
message:Starting Xray Client service

[stop]
command:/usr/local/etc/rc.d/os-xray-client stop
parameters:
type:script
message:Stopping Xray Client service

[restart]
command:/usr/local/etc/rc.d/os-xray-client restart
parameters:
type:script
message:Restarting Xray Client service

[status]
command:/usr/local/etc/rc.d/os-xray-client status; exit 0
parameters:
type:script_output
message:Checking Xray Client status

[healthcheck]
command:/usr/local/opnsense/scripts/OPNsense/XrayClient/healthcheck.py
parameters:
type:script_output
message:Running latency check for Xray outbound nodes

[stats]
command:/usr/local/opnsense/scripts/OPNsense/XrayClient/stats.py
parameters:
type:script_output
message:Querying Xray traffic statistics

[balancer_info]
command:/usr/local/opnsense/scripts/OPNsense/XrayClient/balancer_info.py
parameters:
type:script_output
message:Reading live balancer selections

[version]
command:/usr/local/opnsense/scripts/OPNsense/XrayClient/version.sh
parameters:
type:script_output
message:Checking Xray-core and GeoData versions

[check_updates]
command:/usr/local/opnsense/scripts/OPNsense/XrayClient/check_updates.sh
parameters:
type:script_output
message:Checking for Xray-core and plugin updates on GitHub

[plugin_branches]
command:/usr/local/opnsense/scripts/OPNsense/XrayClient/plugin_branches.py
parameters:
type:script_output
message:Listing os-xray-client branches on GitHub

[warp_probe_start]
command:/usr/local/opnsense/scripts/OPNsense/XrayClient/warp_probe.py start
parameters:%s
type:script_output
message:Starting the WARP endpoint search

[warp_probe_status]
command:/usr/local/opnsense/scripts/OPNsense/XrayClient/warp_probe.py status
parameters:
type:script_output
message:Reading the WARP endpoint search state

[warp_probe_cancel]
command:/usr/local/opnsense/scripts/OPNsense/XrayClient/warp_probe.py cancel
parameters:
type:script_output
message:Cancelling the WARP endpoint search

[warp_masque]
command:/usr/local/opnsense/scripts/OPNsense/XrayClient/warp_masque.py
parameters:
type:script_output
message:Registering a Cloudflare WARP device for MASQUE

[warp_edge_key]
command:/usr/local/opnsense/scripts/OPNsense/XrayClient/warp_edge_key.py
parameters:%s %s %s
type:script_output
message:Fetching the Cloudflare WARP MASQUE edge public key

[update_core]
command:/usr/local/opnsense/scripts/OPNsense/XrayClient/update_core.sh
parameters:%s
type:script_output
message:Updating Xray-core binary (%s)

[update_geodata]
command:/usr/local/opnsense/scripts/OPNsense/XrayClient/update_geodata.sh
parameters:%s %s %s
type:script_output
message:Updating GeoIP and GeoSite databases (%s)

[update_plugin]
command:/usr/local/opnsense/scripts/OPNsense/XrayClient/update_plugin.sh
parameters:%s %s
type:script_output
message:Updating os-xray-client plugin from GitHub (%s %s)

[test_config]
command:/usr/local/opnsense/scripts/OPNsense/XrayClient/test_config.sh
parameters:
type:script_output
message:Validating Xray configuration
